services:
  - type: web
    name: vera-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: TEAM_NAME
        value: Vera Bot
      - key: TEAM_MEMBERS
        value: Solo
      - key: CONTACT_EMAIL
        value: contact@example.com
